spring:
  application:
    name: ms-agrotrack-report
  profiles:
    default: local
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${agrotrack.kafka.grupo}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Valor: ErrorHandlingDeserializer + JsonDeserializer -> Envelope (config/KafkaConfig)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Valor (solo para la DLT): JsonSerializer con el ObjectMapper de Spring (config/KafkaConfig)
    listener:
      ack-mode: record

agrotrack:
  kafka:
    topico-eventos: deliveries.events
    grupo: report-consumer

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
