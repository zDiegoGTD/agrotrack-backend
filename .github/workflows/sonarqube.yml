name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # para lanzarlo a mano desde la pestana Actions

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: Analisis SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # historia completa: Sonar la usa para saber que codigo es nuevo

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Sonar analiza bytecode de Java: cada servicio se compila (con sus tests) y
      # deja sus dependencias en target/dependency. No corre los tests: los de
      # integracion levantan Docker y no hacen falta para el analisis estatico.
      - name: Compilar los 9 microservicios
        run: |
          for m in ms-agrotrack-*/; do
            echo "::group::$m"
            mvn -B -q -f "${m}pom.xml" -DskipTests test-compile dependency:copy-dependencies \
              -DincludeScope=test -DoutputDirectory=target/dependency
            echo "::endgroup::"
          done

      - name: Cache de SonarQube
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analisis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
