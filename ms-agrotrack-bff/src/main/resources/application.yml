spring:
  application:
    name: ms-agrotrack-bff
  profiles:
    default: local

agrotrack:
  # A donde reenvia cada prefijo de /api/<servicio>/**
  servicios:
    deliveries: ${DELIVERIES_URL:http://localhost:8082}
    catalog: ${CATALOG_URL:http://localhost:8083}
    report: ${REPORT_URL:http://localhost:8085}
    audit: ${AUDIT_URL:http://localhost:8086}
    mq: ${MQ_ADMIN_URL:http://localhost:8087}
    kafka: ${KAFKA_ADMIN_URL:http://localhost:8088}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:4200}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
