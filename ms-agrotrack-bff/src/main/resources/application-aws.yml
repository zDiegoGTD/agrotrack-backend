spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI}
          # v1: aud = api://<clientId>; v2 (requestedAccessTokenVersion=2): aud = <clientId>. Se aceptan ambos.
          audiences: api://${AZURE_API_CLIENT_ID},${AZURE_API_CLIENT_ID}

agrotrack:
  cors:
    origenes: ${CORS_ORIGENES}
  seguridad:
    # Ademas del rol: el token debe haberse emitido para usar esta API (claim scp)
    scope-requerido: access_as_user
  gateway:
    # Lo agrega el API Gateway a cada llamada; sin el, el BFF niega (FiltroOrigenGateway)
    secreto: ${GATEWAY_SECRETO:}
