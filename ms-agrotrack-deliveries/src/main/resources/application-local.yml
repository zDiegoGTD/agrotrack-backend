spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agro_deliveries
    username: agro_deliveries
    # Solo para la base del compose local; se reemplaza con SPRING_DATASOURCE_PASSWORD
    password: ${SPRING_DATASOURCE_PASSWORD:agro_deliveries}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:jwt/local-public.pem
