spring:
  application:
    name: ms-agrotrack-deliveries
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Valor: JsonSerializer con el ObjectMapper de Spring, sin cabecera de tipo (config/KafkaConfig)
      # Productor confiable: idempotente (sin duplicados al reintentar), todas las
      # replicas en sincronia confirman (acks=all) y reintenta hasta delivery.timeout.
      acks: all
      retries: 2147483647
      compression-type: lz4
      client-id: ${spring.application.name}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:agrotrack}
    password: ${RABBITMQ_PASSWORD:CambiaEsto123}
    # El productor confirma que el broker recibio el mensaje.
    publisher-confirm-type: correlated
    publisher-returns: true

agrotrack:
  catalog:
    url: ${CATALOG_URL:http://localhost:8083}
  kafka:
    topico-eventos: deliveries.events
  rabbit:
    exchange-comandos: cmd.direct
    # Efecto asincrono del dominio -> routing key de su comando.
    # Cada una calza con un binding direct que declara ms-agrotrack-mq-admin.
    comandos:
      NOTIFICAR_PRODUCTOR: email.send
      EMITIR_TICKET_BODEGA: receipt.ticket
      GENERAR_GUIA_DESPACHO: voucher.gen

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      # En local puede no estar levantado mientras se desarrolla lo demas;
      # que no tumbe el health del servicio.
      enabled: false
