# Analisis en SonarQube Cloud (https://sonarcloud.io/project/overview?id=zDiegoGTD_agrotrack-backend).
# Lo ejecuta .github/workflows/sonarqube.yml en cada push a main y en cada pull request.
#
# El repo no tiene un pom padre: son 9 proyectos Maven independientes. Por eso se
# analizan como un solo proyecto de Sonar, listando las carpetas de cada servicio.

sonar.projectKey=zDiegoGTD_agrotrack-backend
sonar.organization=zdiegogtd
sonar.projectName=agrotrack-backend
sonar.sourceEncoding=UTF-8
sonar.java.source=21

# Codigo de produccion de cada servicio, sus Dockerfile y la infraestructura (compose, scripts)
sonar.sources=\
  ms-agrotrack-audit/src/main,ms-agrotrack-audit/Dockerfile,\
  ms-agrotrack-bff/src/main,ms-agrotrack-bff/Dockerfile,\
  ms-agrotrack-catalog/src/main,ms-agrotrack-catalog/Dockerfile,\
  ms-agrotrack-deliveries/src/main,ms-agrotrack-deliveries/Dockerfile,\
  ms-agrotrack-kafka-admin/src/main,ms-agrotrack-kafka-admin/Dockerfile,\
  ms-agrotrack-mq-admin/src/main,ms-agrotrack-mq-admin/Dockerfile,\
  ms-agrotrack-notify/src/main,ms-agrotrack-notify/Dockerfile,\
  ms-agrotrack-report/src/main,ms-agrotrack-report/Dockerfile,\
  ms-agrotrack-users/src/main,ms-agrotrack-users/Dockerfile,\
  infra

sonar.tests=\
  ms-agrotrack-audit/src/test,\
  ms-agrotrack-bff/src/test,\
  ms-agrotrack-catalog/src/test,\
  ms-agrotrack-deliveries/src/test,\
  ms-agrotrack-kafka-admin/src/test,\
  ms-agrotrack-mq-admin/src/test,\
  ms-agrotrack-notify/src/test,\
  ms-agrotrack-report/src/test,\
  ms-agrotrack-users/src/test

# Bytecode y dependencias: el workflow compila cada servicio antes de analizar
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.java.libraries=**/target/dependency/*.jar
sonar.java.test.libraries=**/target/dependency/*.jar

sonar.exclusions=**/target/**,infra/local/logs/**
