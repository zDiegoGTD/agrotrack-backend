spring:
  application:
    name: ms-agrotrack-catalog
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. validate falla al arrancar si las
      # entidades y las tablas se desincronizaron: mejor ahi que en produccion.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
