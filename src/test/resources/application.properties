# H2 en memoria SOLO para tests. Oracle real vive en Docker.
# Se usa el modo de compatibilidad Oracle para que el SQL generado
# por Hibernate se parezca al de produccion.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Sin broker en los tests unitarios: los tests de integracion con Rabbit y
# Kafka reales usaran Testcontainers cuando Docker este instalado.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
