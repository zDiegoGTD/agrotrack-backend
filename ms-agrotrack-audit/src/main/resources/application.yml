spring:
  application:
    name: ms-agrotrack-audit
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${agrotrack.kafka.grupo}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Valor: ErrorHandlingDeserializer + JsonDeserializer -> Envelope (config/KafkaConfig)
      max-poll-records: 100
      # Solo lo confirmado: nunca se lee algo de una transaccion abortada
      isolation-level: read-committed
      heartbeat-interval: 5s
      client-id: ${spring.application.name}
      properties:
        session.timeout.ms: 15000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Valor: JsonSerializer con el ObjectMapper de Spring, sin cabecera de tipo (config/KafkaConfig)
      # Productor confiable: idempotente (sin duplicados al reintentar), todas las
      # replicas en sincronia confirman (acks=all) y reintenta hasta delivery.timeout.
      acks: all
      retries: 2147483647
      compression-type: lz4
      client-id: ${spring.application.name}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
    listener:
      # El offset se confirma cuando el listener retorna (RECORD): si el
      # proceso muere a mitad, el evento se vuelve a leer y la tabla
      # processed_events lo deduplica.
      ack-mode: record
      # Un hilo por particion (3): el grupo reparte deliveries.events entre
      # ellos y, con mas instancias del servicio, entre las instancias.
      concurrency: ${KAFKA_CONCURRENCIA:3}

agrotrack:
  kafka:
    topico-eventos: deliveries.events
    topico-timeline: audit.timeline
    grupo: audit-consumer

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
